<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coredump Castle</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #ddd; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 16px; background: #000; z-index: 2; }
  #overlay.hidden { display: none; }
  progress { width: min(400px, 80vw); }
  button { font-size: 20px; padding: 12px 32px; cursor: pointer; display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <h1>Coredump Castle</h1>
  <div id="status">Downloading...</div>
  <progress id="progress" value="0" max="100"></progress>
  <button id="start">Click to start</button>
</div>
<script>
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');
  var startBtn = document.getElementById('start');
  var overlay = document.getElementById('overlay');
  var started = false;

  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    // Hold off on starting until the user clicks so the browser allows audio.
    preRun: [function () { Module.addRunDependency('user-gesture'); }],
    setStatus: function (text) {
      var m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) { progressEl.value = +m[1]; progressEl.max = +m[2]; }
      if (text) statusEl.textContent = text;
    },
    monitorRunDependencies: function (left) {
      if (left === 1 && !started) {
        statusEl.textContent = 'Ready';
        progressEl.style.display = 'none';
        startBtn.style.display = 'block';
      }
    },
    onAbort: function (what) { statusEl.textContent = 'Crashed: ' + what; overlay.classList.remove('hidden'); }
  };
  startBtn.addEventListener('click', function () {
    started = true;
    overlay.classList.add('hidden');
    Module.removeRunDependency('user-gesture');
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
